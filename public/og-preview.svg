<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#120c1f"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d50bb"/>
      <stop offset="100%" stop-color="#6e48aa"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glowing orb background accents -->
  <circle cx="200" cy="180" r="240" fill="#9d50bb" opacity="0.12" filter="blur(80px)"/>
  <circle cx="1000" cy="450" r="280" fill="#00f2fe" opacity="0.08" filter="blur(90px)"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 110)">
    <rect width="72" height="72" rx="18" fill="url(#purpleGrad)"/>
    <path d="M42 12L20 37h16l-4 23 24-29h-16l6-19z" fill="#ffffff"/>
  </g>

  <!-- Brand Name -->
  <text x="195" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1">AXE HOURS <tspan fill="#a855f7">AI</tspan></text>
  <rect x="390" y="132" width="130" height="28" rx="14" fill="#a855f7" fill-opacity="0.2"/>
  <text x="455" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="0.5">CREATOR SUITE</text>

  <!-- Main Headline -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="-1">Engineer High-Retention</text>
  <text x="100" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" fill="url(#accentGrad)" letter-spacing="-1">Viral Video Blueprints</text>

  <!-- Subtitle -->
  <text x="100" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="-0.2">
    Psychological hook formulas, competitor velocity radars, AI speech extraction,
  </text>
  <text x="100" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="-0.2">
    and seamless teleprompter execution built for elite short-form creators.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 490)">
    <rect x="0" y="0" width="220" height="42" rx="21" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="110" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e0e7ff" text-anchor="middle">⚡ Viral Hook Architect</text>

    <rect x="236" y="0" width="210" height="42" rx="21" fill="#1e1b4b" stroke="#a855f7" stroke-width="1"/>
    <text x="341" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f3e8ff" text-anchor="middle">🎯 Teleprompter Studio</text>

    <rect x="462" y="0" width="220" height="42" rx="21" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1"/>
    <text x="572" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#cffafe" text-anchor="middle">📊 Competitor Velocity</text>

    <rect x="698" y="0" width="230" height="42" rx="21" fill="#1e1b4b" stroke="#10b981" stroke-width="1"/>
    <text x="813" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#d1fae5" text-anchor="middle">🎙️ Audio Dialogue Engine</text>
  </g>
</svg>
